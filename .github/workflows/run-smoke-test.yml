name: run smoke test

on:
  pull_request:
    branches:
      - develop
      - master
      - stable

jobs:
  run_smoke_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2
      - uses: actions/setup-java@0f62d2ad8407a414cddd4790bed06fd9ebda0f56 # v1
        with:
          java-version: 11
          java-package: jdk
      - run: ./gradlew clean :example:run
        env:
          API_BASE_PATH: "https://nightly-api.regulaforensics.com"
