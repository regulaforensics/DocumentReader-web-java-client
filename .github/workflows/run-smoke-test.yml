name: run smoke test

on:
  pull_request:
    branches:
      - develop
      - master
      - stable

jobs:
  run_smoke_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 11.0.33+100000001
          java-package: jdk
      - run: ./gradlew clean :example:run
        env:
          API_BASE_PATH: ${{ github.base_ref == 'develop' && 'https://nightly-api.regulaforensics.com' || github.base_ref == 'stable' && 'https://rc-api.regulaforensics.com' || github.base_ref == 'master' && 'https://api.regulaforensics.com' || 'https://nightly-api.regulaforensics.com' }}